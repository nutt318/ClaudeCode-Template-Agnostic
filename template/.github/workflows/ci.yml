name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ── Node.js ────────────────────────────────────────────────────────────────
  # Remove this job if your project is not Node/TypeScript/JavaScript
  node:
    name: Node.js — lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck
        # Remove if project has no TypeScript

      - name: Test
        run: npm test -- --coverage

      - name: Build
        run: npm run build

