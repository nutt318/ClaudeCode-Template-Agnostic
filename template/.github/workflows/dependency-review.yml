name: Dependency Review

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          # Block PRs that introduce vulnerabilities at these severity levels
          fail-on-severity: high

          # Post a summary comment on the PR with all findings
          comment-summary-in-pr: always

          # Allow these licenses (add your project's allowed licenses)
          # allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC

          # Deny these licenses (uncomment to block GPL in proprietary projects)
          # deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0
