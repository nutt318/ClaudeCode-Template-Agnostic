version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/src"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Uncomment for Python projects
  # - package-ecosystem: "pip"
  #   directory: "/src"
  #   schedule:
  #     interval: "weekly"

  # Uncomment for Go projects
  # - package-ecosystem: "gomod"
  #   directory: "/src"
  #   schedule:
  #     interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci"
